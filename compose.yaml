services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: hrm-sop-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${SQL_ADMIN_PASSWORD:?Set SQL_ADMIN_PASSWORD in .env}
    ports:
      - "${SQL_PORT:-1433}:1433"
    volumes:
      - hrm_sop_sql_data:/var/opt/mssql
    restart: unless-stopped

volumes:
  hrm_sop_sql_data:

